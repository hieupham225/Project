# Cloudflare Worker: phục vụ cả giao diện (thư mục public/, đóng gói sẵn) và API (/api/*).
name = "phieu-ket-qua"
workers_dev = true
preview_urls = false
main = "src/index.js"
compatibility_date = "2025-06-01"

# Các trang trong public/ được đóng gói vào src/trang.js trước mỗi lần chạy / deploy
[build]
command = "node scripts/dong-goi-trang.mjs"
watch_dir = ["public", "src"]

[[d1_databases]]
binding = "DB"
database_name = "phieu-ket-qua"
# Tạo bằng: npx wrangler d1 create phieu-ket-qua --location apac (đổi id nếu deploy vào tài khoản khác)
database_id = "f3a77dfd-cac6-4203-ba7a-09f23ad4b5f1"
