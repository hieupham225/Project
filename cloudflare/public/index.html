<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tra cứu kết quả học tập · EduLens</title>
  <meta name="description" content="Phụ huynh nhập mã tra cứu để xem phiếu kết quả học tập của con.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
  <style>
    /* Giao diện theo design system Astryx (theme "astryx") */
    :root {
      color-scheme: light;
      --nen: #F8F4ED; --be-mat: #FFFFFF; --chu: #15110C; --phu: #4E606F;
      --mau: #15110C; --tren-mau: #FFFFFF; --mau-nhat: rgba(21,17,12,.08); --thuong-hieu: #225BFF;
      --vien: rgba(5,54,89,.10); --vien-dam: #CCD3DB; --loi: #AA071E; --xanh: #0D8626;
      --cao-nut: 52px;
      --r-trong: 8px; --r-phan-tu: 12px; --r-khung: 16px; --r-tron: 9999px;
      --bong-thap: 0 1px 1px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.06);
      --em: cubic-bezier(.24,1,.4,1);
      --font: Figtree, "Figtree Variable", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 var(--font); background: var(--nen); color: var(--chu); -webkit-font-smoothing: antialiased; }
    :focus-visible { outline: 2px solid var(--thuong-hieu); outline-offset: 2px; }
    .khung { max-width: 860px; margin: 0 auto; padding: 32px 16px 48px; }
    .hep { max-width: 560px; margin: 0 auto; }
    /* Đang xem phiếu (khung rộng): tiêu đề trang thẳng lề với phiếu */
    .khung:has(#manPhieu:not(.an)) .dau-trang { max-width: none; }
    h1 { font-size: 29px; line-height: 1.25; font-weight: 600; letter-spacing: -.015em; margin: 8px 0 6px; }
    .ic { width: 18px; height: 18px; flex: none; vertical-align: -4px; margin-right: 6px; }
    .mo-ta { color: var(--phu); margin: 0 0 24px; font-size: 15px; }
    .thuong-hieu-chan { text-align: center; color: var(--phu); font-size: 13px; margin-top: 32px; }
    .thuong-hieu-chan b { color: var(--chu); font-weight: 600; letter-spacing: .01em; }
    .the { background: var(--be-mat); border: 1px solid var(--vien); border-radius: var(--r-khung); padding: 20px; margin-bottom: 16px; box-shadow: var(--bong-thap); }
    label { display: block; font-weight: 500; font-size: 14px; margin-bottom: 8px; }
    /* Ô mã tra cứu: cao hơn nút, bo góc = 1/2 chiều cao nút "Xem kết quả", chữ nằm giữa */
    input { width: 100%; font: 600 clamp(22px, 7.6vw, 30px)/1 "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: clamp(2px, 1.2vw, 5px); text-transform: uppercase; text-align: center; color: var(--chu); height: 98px; padding: 0 16px; border: 1px solid var(--vien-dam); border-radius: calc(var(--cao-nut) / 2); background: var(--be-mat); transition: border-color .125s, box-shadow .125s; }
    input::placeholder { color: #A4B0BC; font-weight: 400; font-size: clamp(16px, 5.4vw, 24px); letter-spacing: 2px; text-align: center; }
    input:focus { outline: none; border-color: var(--thuong-hieu); box-shadow: 0 0 0 3px rgba(34,91,255,.18); }
    button { width: 100%; margin-top: 14px; font: 600 16px/22px var(--font); min-height: var(--cao-nut); padding: 0 22px; border: 0; border-radius: var(--r-tron); background: var(--mau); color: var(--tren-mau); cursor: pointer; transition: background-color .125s var(--em), transform .1s; }
    button:hover:not(:disabled) { background: #2E2924; }
    button:active:not(:disabled) { transform: scale(.985); }
    button:disabled { opacity: .5; cursor: wait; }
    button.phu { background: var(--mau-nhat); color: var(--chu); }
    button.phu:hover:not(:disabled) { background: rgba(21,17,12,.14); }
    .loi { color: var(--loi); margin-top: 10px; font-size: 14px; }
    .loi:empty { display: none; }
    .ten-hs { font-size: 22px; font-weight: 700; letter-spacing: -.01em; margin: 0; }
    .lop { color: var(--phu); margin: 4px 0 0; }
    h2 { font-size: 18px; font-weight: 700; margin: 0 0 12px; color: var(--chu); }
    .ds-phieu button { text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .ds-phieu .ngay { font-weight: 400; font-size: 14px; opacity: .8; }
    .bai { margin-top: 18px; }
    .bai:first-of-type { margin-top: 4px; }
    .bai h3 { font-size: 16px; font-weight: 600; margin: 0 0 2px; }
    .bai .phu-de { color: var(--phu); font-size: 13px; margin: 0 0 4px; }
    .bai button { margin-top: 8px; min-height: 44px; padding: 10px 16px; font-size: 15px; }
    .chenh { font-size: 12px; font-weight: 700; margin-left: 6px; padding: 1px 7px; border-radius: var(--r-tron); }
    .chenh.tang { color: #09441F; background: #24BB5E26; } .chenh.giam { color: var(--loi); background: #E3193B1F; }
    .bieu-do svg { width: 100%; height: auto; display: block; }
    .bieu-do .chu-thich { color: var(--phu); font-size: 13px; margin-top: 6px; }
    .bieu-do { margin: 4px 0 8px; }
    .bieu-do .chu-giai { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--phu); margin-top: 4px; }
    .bieu-do .chu-giai span { display: inline-flex; align-items: center; gap: 6px; }
    .bieu-do .chu-giai i { display: inline-block; width: 18px; height: 0; }
    .nhom-the h2 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .nhom-the h2 .ten-nhom { display: inline-flex; align-items: center; }
    .nhom-the h2 .so { font-size: 13px; color: var(--phu); font-weight: 500; }
    .muc-con { font-size: 13px; font-weight: 600; color: var(--phu); text-transform: uppercase; letter-spacing: .04em; margin: 18px 0 0; }
    .tom-tat-nhom { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .tom-tat-nhom a { font-size: 13px; padding: 4px 12px; border-radius: var(--r-tron); background: var(--mau-nhat); color: var(--chu); text-decoration: none; font-weight: 500; }
    .tom-tat-nhom a:hover { background: rgba(21,17,12,.14); }
    table { width: 100%; border-collapse: collapse; }
    td { padding: 10px 4px; border-top: 1px solid var(--vien); vertical-align: top; }
    tr:first-child td { border-top: 0; }
    td.ten { color: var(--phu); width: 45%; }
    td.gt { font-weight: 600; white-space: pre-wrap; word-break: break-word; }
    .thanh { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
    .thanh button { width: auto; margin: 0; min-height: 40px; padding: 8px 16px; font-size: 15px; }
    .thanh .tieu-de { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dang-tai { text-align: center; color: var(--phu); padding: 24px; }
    .an { display: none !important; }
    .ghi-chu { color: var(--phu); font-size: 13px; text-align: center; margin-top: 28px; }
  </style>
</head>
<body>
  <div class="khung">
    <div class="hep dau-trang">
      <h1>Tra cứu kết quả học tập</h1>
      <p class="mo-ta">Nhập mã tra cứu giáo viên đã gửi riêng cho quý phụ huynh.</p>
    </div>

    <!-- Màn 1: nhập mã -->
    <div id="manNhap" class="the hep">
      <form id="form">
        <label for="ma">Mã tra cứu</label>
        <input id="ma" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="VD: K7X9-2QMP" maxlength="20" required>
        <button id="nut" type="submit">Xem kết quả</button>
        <div id="loi" class="loi" role="alert"></div>
      </form>
    </div>

    <!-- Màn 2: danh sách phiếu + bảng điểm -->
    <div id="manKetQua" class="an hep">
      <div class="the">
        <p id="tenHs" class="ten-hs"></p>
        <p id="lopHs" class="lop"></p>
      </div>
      <div id="dsPhieu" class="ds-phieu"></div>
      <div id="dsBang"></div>
      <button id="nutLai" class="phu" type="button">Tra cứu mã khác</button>
    </div>

    <!-- Màn 3: xem phiếu PDF -->
    <div id="manPhieu" class="an">
      <div class="thanh">
        <button id="nutQuayLai" class="phu" type="button"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/></svg>Quay lại</button>
        <span id="tenPhieu" class="tieu-de"></span>
        <button id="nutTai" type="button">Tải PDF</button>
      </div>
      <div id="trangPdf"></div>
    </div>

    <p class="ghi-chu">Vui lòng không chia sẻ mã tra cứu cho người khác.</p>
  </div>

  <script src="/phieu.js"></script>
  <script>
    var $ = function (id) { return document.getElementById(id); };
    // Gọi API của máy chủ (Cloudflare Worker)
    function api(duongDan, duLieu) {
      return fetch(duongDan, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-KQ': '1' }, body: JSON.stringify(duLieu) })
        .then(function (r) { return r.json().catch(function () { return { ok: false, loi: 'Có lỗi xảy ra, vui lòng thử lại.' }; }); });
    }
    var maDangDung = '';
    var phieuHienTai = null; // { khung: iframe, ten }
    // Tên file không dấu để mọi máy / trình duyệt đều lưu đúng tên
    function tenFileKhongDau(s) {
      return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[đĐ]/g, function (c) { return c === 'đ' ? 'd' : 'D'; })
        .replace(/[^A-Za-z0-9_-]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '').slice(0, 100) || 'phieu';
    }
    var HTML2PDF = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';

    function hien(id) {
      ['manNhap', 'manKetQua', 'manPhieu'].forEach(function (m) { $(m).classList.toggle('an', m !== id); });
      window.scrollTo(0, 0);
    }

    // Dùng textContent (không dùng innerHTML) để dữ liệu nhập vào không thể chèn mã độc.
    var ICON = {"book-open": '<path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25"/>', "document-text": '<path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/>'};
    function ic(ten) { var t = document.createElement('template'); t.innerHTML = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">' + ICON[ten] + '</svg>'; return t.content.firstChild; }
    function taoThe(tag, cls, text) {
      var el = document.createElement(tag);
      if (cls) el.className = cls;
      if (text != null) el.textContent = text;
      return el;
    }

    $('form').addEventListener('submit', function (e) {
      e.preventDefault();
      var ma = $('ma').value.trim();
      if (!ma) return;
      $('nut').disabled = true;
      $('nut').textContent = 'Đang tra cứu...';
      $('loi').textContent = '';
      api('/api/tra-cuu', { ma: ma })
        .then(function (kq) { hienKetQua(kq, ma); })
        .catch(function () { baoLoi('Không kết nối được. Vui lòng thử lại.'); });
    });

    $('nutLai').addEventListener('click', function () {
      maDangDung = '';
      $('ma').value = '';
      $('dsBang').textContent = '';
      $('dsPhieu').textContent = '';
      hien('manNhap');
      $('ma').focus();
    });

    $('nutQuayLai').addEventListener('click', function () {
      $('trangPdf').textContent = '';
      phieuHienTai = null;
      hien('manKetQua');
    });

    // Tạo PDF ngay trên máy (không cần máy chủ): dựng 1 bản phiếu ẩn rộng đúng khổ A4, nạp html2pdf vào đó rồi lưu file
    $('nutTai').addEventListener('click', function () {
      if (!phieuHienTai) return;
      var nut = $('nutTai');
      nut.disabled = true; nut.textContent = 'Đang tạo PDF…';
      var an = document.createElement('iframe');
      an.setAttribute('aria-hidden', 'true');
      an.style.cssText = 'position:absolute;left:-10000px;top:0;width:794px;height:1123px;border:0';
      var xong = function () { nut.disabled = false; nut.textContent = 'Tải PDF'; an.remove(); };
      var thatBai = function (loi, thongDiep) { if (loi) console.error(loi); xong(); alert(thongDiep || 'Không tạo được PDF trên trình duyệt này.'); };
      an.onload = function () {
        var w = an.contentWindow, d = w.document, sc = d.createElement('script');
        sc.src = HTML2PDF;
        sc.onerror = function () { thatBai(null, 'Không tải được công cụ tạo PDF. Kiểm tra kết nối mạng.'); };
        sc.onload = function () {
          // Tạo tùy chọn trong chính khung (html2pdf kiểm tra "instanceof Array" theo môi trường của khung)
          var tuyChon = w.JSON.parse(JSON.stringify({ margin: [8, 6, 8, 6], filename: phieuHienTai.ten, image: { type: 'jpeg', quality: 0.95 },
            html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }, pagebreak: { mode: ['css', 'legacy'] } }));
          w.html2pdf().set(tuyChon).from(d.getElementById('phieu')).outputPdf('blob').then(function (blob) {
            // Lưu file từ trang chính để giữ đúng tên file
            var url = URL.createObjectURL(blob), a = document.createElement('a');
            a.href = url; a.download = phieuHienTai.ten; document.body.appendChild(a); a.click(); a.remove();
            setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
            xong();
          }, thatBai);
        };
        d.head.appendChild(sc);
      };
      an.srcdoc = phieuHienTai.html;
      document.body.appendChild(an);
    });

    function baoLoi(msg) {
      $('nut').disabled = false;
      $('nut').textContent = 'Xem kết quả';
      $('loi').textContent = msg;
    }

    function hienKetQua(kq, ma) {
      if (!kq || !kq.ok) { baoLoi((kq && kq.loi) || 'Có lỗi xảy ra.'); return; }
      maDangDung = ma;
      $('nut').disabled = false;
      $('nut').textContent = 'Xem kết quả';
      $('tenHs').textContent = kq.hocSinh.hoTen || 'Học sinh';
      $('lopHs').textContent = [kq.trungTam, (kq.hocSinh.nhom || []).length ? 'Lớp: ' + kq.hocSinh.nhom.join(' · ') : ''].filter(Boolean).join(' — ');

      // Mỗi nhóm/môn 1 khối (nhóm có bài thi gần nhất lên đầu); trong khối: biểu đồ tiến bộ + các bài thi + các lần làm
      var dsP = $('dsPhieu');
      dsP.textContent = '';
      var phieu = kq.phieu || [], theoNhom = {}, thuTuNhom = [];
      phieu.forEach(function (p) {
        var n = p.nhom || 'Khác';
        if (!theoNhom[n]) { theoNhom[n] = []; }
        theoNhom[n].push(p);
        thuTuNhom = thuTuNhom.filter(function (x) { return x !== n; }).concat([n]);
      });
      thuTuNhom.reverse();
      if (thuTuNhom.length > 1) {
        var tt = taoThe('div', 'tom-tat-nhom');
        thuTuNhom.forEach(function (n, i) {
          var a = taoThe('a', null, n + ' (' + theoNhom[n].length + ')');
          a.href = '#nhom' + i;
          a.addEventListener('click', function (e) { e.preventDefault(); $('nhom' + i).scrollIntoView({ behavior: 'smooth' }); });
          tt.appendChild(a);
        });
        $('lopHs').appendChild(tt);
      }
      thuTuNhom.forEach(function (n, iN) {
        var the = taoThe('div', 'the nhom-the');
        the.id = 'nhom' + iN;
        var h2 = taoThe('h2'), tenN = taoThe('span', 'ten-nhom', n); tenN.insertBefore(ic('book-open'), tenN.firstChild); h2.appendChild(tenN);
        h2.appendChild(taoThe('span', 'so', theoNhom[n].length + ' phiếu'));
        the.appendChild(h2);
        var bd = veBieuDo(theoNhom[n]);
        if (bd) { the.appendChild(taoThe('p', 'muc-con', 'Tiến bộ')); the.appendChild(bd); }
        var theoBai = {}, thuTuBai = [];
        theoNhom[n].forEach(function (p) {
          if (!theoBai[p.baiThi]) { theoBai[p.baiThi] = []; thuTuBai.push(p.baiThi); }
          theoBai[p.baiThi].push(p);
        });
        thuTuBai.reverse().forEach(function (b) {
          var cac = theoBai[b].sort(function (a, c) { return a.lan - c.lan; });
          var khoi = taoThe('div', 'bai');
          khoi.appendChild(taoThe('h3', null, b));
          khoi.appendChild(taoThe('p', 'phu-de', cac.length > 1 ? cac.length + ' lần làm' : '1 lần làm'));
          cac.slice().reverse().forEach(function (p, i, arr) {
            var nut = taoThe('button', 'phu');
            nut.type = 'button';
            nut.appendChild(ic('document-text')); nut.appendChild(taoThe('span', null, (cac.length > 1 || p.lan > 1 ? 'Lần ' + p.lan : 'Xem phiếu') + (p.ngayThi ? ' · ' + p.ngayThi : '')));
            var phai = taoThe('span', 'ngay', p.tongDiem ? p.tongDiem + (p.diemToiDa ? '/' + p.diemToiDa : '') + ' điểm' : '');
            var truoc = arr[i + 1];
            if (truoc && p.tongDiem && truoc.tongDiem) {
              var c = parseFloat(p.tongDiem) - parseFloat(truoc.tongDiem);
              if (c) phai.appendChild(taoThe('span', 'chenh ' + (c > 0 ? 'tang' : 'giam'), (c > 0 ? '▲ +' : '▼ ') + c.toFixed(2)));
            }
            nut.appendChild(phai);
            nut.addEventListener('click', function () { moPhieu(p); });
            khoi.appendChild(nut);
          });
          the.appendChild(khoi);
        });
        dsP.appendChild(the);
      });
      var coPhieu = phieu.length > 0;

      var ds = $('dsBang');
      ds.textContent = '';
      if (!coPhieu) ds.appendChild(taoThe('div', 'the', 'Chưa có phiếu kết quả nào được công bố.'));
      hien('manKetQua');
    }

    /* Biểu đồ đường: tổng điểm (quy về thang 10) theo thứ tự thời gian */
    var MAU_TB = '#225BFF';
    function veBieuDo(phieu) {
      var khung = taoThe('div', 'bieu-do');
      var diem = phieu.filter(function (p) { return p.tongDiem !== ''; }).map(function (p) {
        var max = parseFloat(p.diemToiDa) || 10;
        return { v: parseFloat(p.tongDiem) / max * 10, tb: p.tbLop == null ? null : +p.tbLop, nhan: p.baiThi + ' – Lần ' + p.lan + (p.ngayThi ? ' (' + p.ngayThi + ')' : ''), goc: p.tongDiem + '/' + (p.diemToiDa || 10) };
      });
      if (diem.length < 2) return null;
      var W = 520, H = 220, L = 34, Rr = 14, T = 16, B = 30;
      var ns = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
      svg.setAttribute('role', 'img');
      svg.setAttribute('aria-label', 'Biểu đồ điểm qua các bài thi');
      var el = function (tag, at, text) {
        var e = document.createElementNS(ns, tag);
        Object.keys(at).forEach(function (k) { e.setAttribute(k, at[k]); });
        if (text != null) e.textContent = text;
        svg.appendChild(e); return e;
      };
      var x = function (i) { return L + (diem.length === 1 ? 0 : i * (W - L - Rr) / (diem.length - 1)); };
      var y = function (v) { return T + (10 - v) * (H - T - B) / 10; };
      [0, 5, 8, 10].forEach(function (m) {
        el('line', { x1: L, x2: W - Rr, y1: y(m), y2: y(m), stroke: '#E3E0D9', 'stroke-dasharray': m === 0 ? '' : '3 3' });
        el('text', { x: L - 6, y: y(m) + 4, 'text-anchor': 'end', 'font-size': 11, fill: '#4E606F' }, m);
      });
      // đường so sánh: điểm trung bình lớp ở từng lần thi (nét đứt xanh)
      var coTb = diem.some(function (d) { return d.tb != null; });
      if (coTb) {
        var s = ''; diem.forEach(function (d, i) { if (d.tb != null) s += (s ? 'L' : 'M') + x(i) + ' ' + y(d.tb); });
        el('path', { d: s, fill: 'none', stroke: MAU_TB, 'stroke-width': 2, 'stroke-dasharray': '6 4', 'stroke-linejoin': 'round' });
        diem.forEach(function (d, i) {
          if (d.tb == null) return;
          var c = el('circle', { cx: x(i), cy: y(d.tb), r: 3.5, fill: MAU_TB, stroke: '#fff', 'stroke-width': 1.5 });
          var tt = document.createElementNS(ns, 'title'); tt.textContent = d.nhan + ' – trung bình lớp: ' + d.tb.toFixed(2) + '/10'; c.appendChild(tt);
        });
      }
      el('polyline', { points: diem.map(function (d, i) { return x(i) + ',' + y(d.v); }).join(' '), fill: 'none', stroke: '#15110C', 'stroke-width': 2.5, 'stroke-linejoin': 'round' });
      diem.forEach(function (d, i) {
        var c = el('circle', { cx: x(i), cy: y(d.v), r: 5, fill: '#fff', stroke: '#15110C', 'stroke-width': 2.5 });
        var tt = document.createElementNS(ns, 'title'); tt.textContent = d.nhan + ': ' + d.goc + (d.tb != null ? ' (trung bình lớp ' + d.tb.toFixed(2) + '/10)' : ''); c.appendChild(tt);
        el('text', { x: x(i), y: y(d.v) - 10, 'text-anchor': 'middle', 'font-size': 11, 'font-weight': 700, fill: '#15110C' }, d.v.toFixed(1));
        el('text', { x: x(i), y: H - 10, 'text-anchor': 'middle', 'font-size': 11, fill: '#4E606F' }, i + 1);
      });
      khung.appendChild(svg);
      if (coTb) {
        var cg = taoThe('div', 'chu-giai');
        var muc = function (mau, kieu, chu) { var s = taoThe('span'); var i = taoThe('i'); i.style.borderTop = '2px ' + kieu + ' ' + mau; s.appendChild(i); s.appendChild(document.createTextNode(chu)); cg.appendChild(s); };
        muc('#15110C', 'solid', 'Điểm của con'); muc(MAU_TB, 'dashed', 'Trung bình lớp');
        khung.appendChild(cg);
      }
      var ct = taoThe('div', 'chu-thich');
      ct.textContent = 'Điểm quy về thang 10. ' + diem.map(function (d, i) { return (i + 1) + ': ' + d.nhan; }).join(' · ');
      khung.appendChild(ct);
      return khung;
    }

    function moPhieu(p) {
      $('tenPhieu').textContent = p.baiThi + ' – Lần ' + p.lan;
      var khung = $('trangPdf');
      khung.textContent = '';
      khung.appendChild(taoThe('div', 'dang-tai', 'Đang tải phiếu...'));
      $('nutTai').disabled = true;
      hien('manPhieu');
      api('/api/phieu', { ma: maDangDung, maPhieu: p.maPhieu }).then(function (kq) {
        khung.textContent = '';
        if (!kq || !kq.ok) { khung.appendChild(taoThe('div', 'the loi', (kq && kq.loi) || 'Không tải được phiếu.')); return; }
        // Phiếu dựng từ dữ liệu, đặt trong khung riêng để kiểu chữ của phiếu không lẫn với trang
        var f = document.createElement('iframe');
        f.title = 'Phiếu kết quả';
        f.style.cssText = 'width:100%;height:70vh;border:0;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.08);border-radius:12px';
        f.onload = function () { try { f.style.height = (f.contentDocument.documentElement.scrollHeight + 8) + 'px'; } catch (e) { /* giữ chiều cao mặc định */ } };
        f.srcdoc = renderPhieu(kq.d, kq.logo);
        khung.appendChild(f);
        phieuHienTai = { khung: f, html: f.srcdoc, ten: tenFileKhongDau(p.baiThi + '_Lan-' + p.lan + '_' + kq.d.hoTen) + '.pdf' };
        $('nutTai').disabled = false;
      }).catch(function () { khung.textContent = ''; khung.appendChild(taoThe('div', 'the loi', 'Không kết nối được. Vui lòng thử lại.')); });
    }
  </script>
  <p class="thuong-hieu-chan">Phiếu kết quả được tạo bằng <b>EduLens</b></p>
