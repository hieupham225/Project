<!DOCTYPE html>
<html lang="vi">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root { --mau: #1a73e8; --nen: #f4f6fb; --chu: #1f2937; --phu: #6b7280; --vien: #e5e7eb; --loi: #c62828; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--nen); color: var(--chu); }
    .khung { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
    .hep { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 8px 0 4px; }
    .mo-ta { color: var(--phu); margin: 0 0 20px; font-size: 15px; }
    .the { background: #fff; border: 1px solid var(--vien); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    input { width: 100%; font-size: 20px; letter-spacing: 2px; text-transform: uppercase; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; }
    input:focus { outline: 2px solid var(--mau); border-color: var(--mau); }
    button { width: 100%; margin-top: 12px; font-size: 17px; font-weight: 600; padding: 12px; border: 0; border-radius: 8px; background: var(--mau); color: #fff; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    button.phu { background: #fff; color: var(--mau); border: 1px solid var(--mau); }
    .loi { color: var(--loi); margin-top: 10px; min-height: 1em; }
    .ten-hs { font-size: 20px; font-weight: 700; margin: 0; }
    .lop { color: var(--phu); margin: 4px 0 0; }
    h2 { font-size: 17px; margin: 0 0 10px; color: var(--mau); }
    .ds-phieu button { text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .ds-phieu .ngay { font-weight: 400; font-size: 14px; opacity: .85; }
    .bai { margin-top: 18px; }
    .bai:first-of-type { margin-top: 4px; }
    .bai h3 { font-size: 16px; margin: 0 0 2px; }
    .bai .phu-de { color: var(--phu); font-size: 13px; margin: 0 0 4px; }
    .bai button { margin-top: 8px; padding: 10px 12px; font-size: 16px; }
    .chenh { font-size: 13px; font-weight: 700; margin-left: 6px; }
    .chenh.tang { color: #1e8e3e; } .chenh.giam { color: var(--loi); }
    .bieu-do svg { width: 100%; height: auto; display: block; }
    .bieu-do .chu-thich { color: var(--phu); font-size: 13px; margin-top: 6px; }
    .bieu-do { margin: 4px 0 8px; }
    .nhom-the h2 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .nhom-the h2 .so { font-size: 13px; color: var(--phu); font-weight: 500; }
    .muc-con { font-size: 14px; font-weight: 700; color: var(--chu); margin: 14px 0 0; }
    .tom-tat-nhom { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tom-tat-nhom a { font-size: 13px; padding: 3px 10px; border-radius: 12px; background: #e8f0fe; color: #174ea6; text-decoration: none; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; }
    td { padding: 9px 4px; border-top: 1px solid var(--vien); vertical-align: top; }
    tr:first-child td { border-top: 0; }
    td.ten { color: var(--phu); width: 45%; }
    td.gt { font-weight: 600; white-space: pre-wrap; word-break: break-word; }
    .thanh { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
    .thanh button { width: auto; margin: 0; padding: 10px 14px; font-size: 15px; }
    .thanh .tieu-de { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #trangPdf canvas { display: block; width: 100%; height: auto; background: #fff; margin: 0 auto 12px; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
    .dang-tai { text-align: center; color: var(--phu); padding: 24px; }
    .an { display: none !important; }
    .ghi-chu { color: var(--phu); font-size: 13px; text-align: center; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="khung">
    <div class="hep">
      <h1><?= tieuDe ?></h1>
      <p class="mo-ta">Nhập mã tra cứu giáo viên đã gửi riêng cho quý phụ huynh.</p>
    </div>

    <!-- Màn 1: nhập mã -->
    <div id="manNhap" class="the hep">
      <form id="form">
        <label for="ma">Mã tra cứu</label>
        <input id="ma" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="VD: K7X9-2QMP" maxlength="20" required>
        <button id="nut" type="submit">Xem kết quả</button>
        <div id="loi" class="loi" role="alert"></div>
      </form>
    </div>

    <!-- Màn 2: danh sách phiếu + bảng điểm -->
    <div id="manKetQua" class="an hep">
      <div class="the">
        <p id="tenHs" class="ten-hs"></p>
        <p id="lopHs" class="lop"></p>
      </div>
      <div id="dsPhieu" class="ds-phieu"></div>
      <div id="dsBang"></div>
      <button id="nutLai" class="phu" type="button">Tra cứu mã khác</button>
    </div>

    <!-- Màn 3: xem phiếu PDF -->
    <div id="manPhieu" class="an">
      <div class="thanh">
        <button id="nutQuayLai" class="phu" type="button">← Quay lại</button>
        <span id="tenPhieu" class="tieu-de"></span>
        <button id="nutTai" type="button">Tải PDF</button>
      </div>
      <div id="trangPdf"></div>
    </div>

    <p class="ghi-chu">Vui lòng không chia sẻ mã tra cứu cho người khác.</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    var $ = function (id) { return document.getElementById(id); };
    var maDangDung = '';
    var pdfHienTai = null; // { ten, bytes }

    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    function hien(id) {
      ['manNhap', 'manKetQua', 'manPhieu'].forEach(function (m) { $(m).classList.toggle('an', m !== id); });
      window.scrollTo(0, 0);
    }

    // Dùng textContent (không dùng innerHTML) để nội dung trong Sheet không thể chèn mã độc.
    function taoThe(tag, cls, text) {
      var el = document.createElement(tag);
      if (cls) el.className = cls;
      if (text != null) el.textContent = text;
      return el;
    }

    $('form').addEventListener('submit', function (e) {
      e.preventDefault();
      var ma = $('ma').value.trim();
      if (!ma) return;
      $('nut').disabled = true;
      $('nut').textContent = 'Đang tra cứu...';
      $('loi').textContent = '';
      google.script.run
        .withSuccessHandler(function (kq) { hienKetQua(kq, ma); })
        .withFailureHandler(function () { baoLoi('Không kết nối được. Vui lòng thử lại.'); })
        .traCuu(ma);
    });

    $('nutLai').addEventListener('click', function () {
      maDangDung = '';
      $('ma').value = '';
      $('dsBang').textContent = '';
      $('dsPhieu').textContent = '';
      hien('manNhap');
      $('ma').focus();
    });

    $('nutQuayLai').addEventListener('click', function () {
      $('trangPdf').textContent = '';
      pdfHienTai = null;
      hien('manKetQua');
    });

    $('nutTai').addEventListener('click', function () {
      if (!pdfHienTai) return;
      var url = URL.createObjectURL(new Blob([pdfHienTai.bytes], { type: 'application/pdf' }));
      var a = document.createElement('a');
      a.href = url;
      a.download = pdfHienTai.ten;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    });

    function baoLoi(msg) {
      $('nut').disabled = false;
      $('nut').textContent = 'Xem kết quả';
      $('loi').textContent = msg;
    }

    function hienKetQua(kq, ma) {
      if (!kq || !kq.ok) { baoLoi((kq && kq.loi) || 'Có lỗi xảy ra.'); return; }
      maDangDung = ma;
      $('nut').disabled = false;
      $('nut').textContent = 'Xem kết quả';
      $('tenHs').textContent = kq.hocSinh.hoTen || 'Học sinh';
      $('lopHs').textContent = (kq.hocSinh.nhom || []).length ? 'Nhóm / lớp: ' + kq.hocSinh.nhom.join(' · ') : '';

      // Mỗi nhóm/môn 1 khối (nhóm có bài thi gần nhất lên đầu); trong khối: biểu đồ tiến bộ + các bài thi + các lần làm
      var dsP = $('dsPhieu');
      dsP.textContent = '';
      var phieu = kq.phieu || [], theoNhom = {}, thuTuNhom = [];
      phieu.forEach(function (p) {
        var n = p.nhom || 'Khác';
        if (!theoNhom[n]) { theoNhom[n] = []; }
        theoNhom[n].push(p);
        thuTuNhom = thuTuNhom.filter(function (x) { return x !== n; }).concat([n]);
      });
      thuTuNhom.reverse();
      if (thuTuNhom.length > 1) {
        var tt = taoThe('div', 'tom-tat-nhom');
        thuTuNhom.forEach(function (n, i) {
          var a = taoThe('a', null, n + ' (' + theoNhom[n].length + ')');
          a.href = '#nhom' + i;
          a.addEventListener('click', function (e) { e.preventDefault(); $('nhom' + i).scrollIntoView({ behavior: 'smooth' }); });
          tt.appendChild(a);
        });
        $('lopHs').appendChild(tt);
      }
      thuTuNhom.forEach(function (n, iN) {
        var the = taoThe('div', 'the nhom-the');
        the.id = 'nhom' + iN;
        var h2 = taoThe('h2', null, '📚 ' + n);
        h2.appendChild(taoThe('span', 'so', theoNhom[n].length + ' phiếu'));
        the.appendChild(h2);
        var bd = veBieuDo(theoNhom[n]);
        if (bd) { the.appendChild(taoThe('p', 'muc-con', 'Tiến bộ')); the.appendChild(bd); }
        var theoBai = {}, thuTuBai = [];
        theoNhom[n].forEach(function (p) {
          if (!theoBai[p.baiThi]) { theoBai[p.baiThi] = []; thuTuBai.push(p.baiThi); }
          theoBai[p.baiThi].push(p);
        });
        thuTuBai.reverse().forEach(function (b) {
          var cac = theoBai[b].sort(function (a, c) { return a.lan - c.lan; });
          var khoi = taoThe('div', 'bai');
          khoi.appendChild(taoThe('h3', null, b));
          khoi.appendChild(taoThe('p', 'phu-de', cac.length > 1 ? cac.length + ' lần làm' : '1 lần làm'));
          cac.slice().reverse().forEach(function (p, i, arr) {
            var nut = taoThe('button', 'phu');
            nut.type = 'button';
            nut.appendChild(taoThe('span', null, '📄 ' + (cac.length > 1 || p.lan > 1 ? 'Lần ' + p.lan : 'Xem phiếu') + (p.ngayThi ? ' · ' + p.ngayThi : '')));
            var phai = taoThe('span', 'ngay', p.tongDiem ? p.tongDiem + (p.diemToiDa ? '/' + p.diemToiDa : '') + ' điểm' : '');
            var truoc = arr[i + 1];
            if (truoc && p.tongDiem && truoc.tongDiem) {
              var c = parseFloat(p.tongDiem) - parseFloat(truoc.tongDiem);
              if (c) phai.appendChild(taoThe('span', 'chenh ' + (c > 0 ? 'tang' : 'giam'), (c > 0 ? '▲ +' : '▼ ') + c.toFixed(2)));
            }
            nut.appendChild(phai);
            nut.addEventListener('click', function () { moPhieu(p); });
            khoi.appendChild(nut);
          });
          the.appendChild(khoi);
        });
        dsP.appendChild(the);
      });
      var coPhieu = phieu.length > 0;

      var ds = $('dsBang');
      ds.textContent = '';
      if (!coPhieu) ds.appendChild(taoThe('div', 'the', 'Chưa có phiếu kết quả nào được công bố.'));
      hien('manKetQua');
    }

    /* Biểu đồ đường: tổng điểm (quy về thang 10) theo thứ tự thời gian */
    function veBieuDo(phieu) {
      var khung = taoThe('div', 'bieu-do');
      var diem = phieu.filter(function (p) { return p.tongDiem !== ''; }).map(function (p) {
        var max = parseFloat(p.diemToiDa) || 10;
        return { v: parseFloat(p.tongDiem) / max * 10, nhan: p.baiThi + ' – Lần ' + p.lan + (p.ngayThi ? ' (' + p.ngayThi + ')' : ''), goc: p.tongDiem + '/' + (p.diemToiDa || 10) };
      });
      if (diem.length < 2) return null;
      var W = 520, H = 220, L = 34, Rr = 14, T = 16, B = 30;
      var ns = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
      svg.setAttribute('role', 'img');
      svg.setAttribute('aria-label', 'Biểu đồ điểm qua các bài thi');
      var el = function (tag, at, text) {
        var e = document.createElementNS(ns, tag);
        Object.keys(at).forEach(function (k) { e.setAttribute(k, at[k]); });
        if (text != null) e.textContent = text;
        svg.appendChild(e); return e;
      };
      var x = function (i) { return L + (diem.length === 1 ? 0 : i * (W - L - Rr) / (diem.length - 1)); };
      var y = function (v) { return T + (10 - v) * (H - T - B) / 10; };
      [0, 5, 8, 10].forEach(function (m) {
        el('line', { x1: L, x2: W - Rr, y1: y(m), y2: y(m), stroke: '#e5e7eb', 'stroke-dasharray': m === 0 ? '' : '3 3' });
        el('text', { x: L - 6, y: y(m) + 4, 'text-anchor': 'end', 'font-size': 11, fill: '#6b7280' }, m);
      });
      el('polyline', { points: diem.map(function (d, i) { return x(i) + ',' + y(d.v); }).join(' '), fill: 'none', stroke: '#1a73e8', 'stroke-width': 2.5, 'stroke-linejoin': 'round' });
      diem.forEach(function (d, i) {
        var c = el('circle', { cx: x(i), cy: y(d.v), r: 5, fill: '#fff', stroke: '#1a73e8', 'stroke-width': 2.5 });
        var tt = document.createElementNS(ns, 'title'); tt.textContent = d.nhan + ': ' + d.goc; c.appendChild(tt);
        el('text', { x: x(i), y: y(d.v) - 10, 'text-anchor': 'middle', 'font-size': 11, 'font-weight': 700, fill: '#1f2937' }, d.v.toFixed(1));
        el('text', { x: x(i), y: H - 10, 'text-anchor': 'middle', 'font-size': 11, fill: '#6b7280' }, i + 1);
      });
      khung.appendChild(svg);
      var ct = taoThe('div', 'chu-thich');
      ct.textContent = 'Điểm quy về thang 10. ' + diem.map(function (d, i) { return (i + 1) + ': ' + d.nhan; }).join(' · ');
      khung.appendChild(ct);
      return khung;
    }

    function moPhieu(p) {
      $('tenPhieu').textContent = p.baiThi + ' – Lần ' + p.lan;
      var khung = $('trangPdf');
      khung.textContent = '';
      khung.appendChild(taoThe('div', 'dang-tai', 'Đang tải phiếu...'));
      $('nutTai').disabled = true;
      hien('manPhieu');
      google.script.run
        .withSuccessHandler(function (kq) {
          if (!kq || !kq.ok) { khung.textContent = ''; khung.appendChild(taoThe('div', 'the loi', (kq && kq.loi) || 'Không tải được phiếu.')); return; }
          if (kq.html) { // chế độ demo: phiếu dạng HTML thay cho PDF
            khung.textContent = '';
            var f = document.createElement('iframe');
            f.setAttribute('sandbox', ''); f.srcdoc = kq.html;
            f.style.cssText = 'width:100%;height:80vh;border:0;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15)';
            khung.appendChild(f); return;
          }
          var bin = atob(kq.pdf), bytes = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          pdfHienTai = { ten: kq.tenFile, bytes: bytes };
          $('nutTai').disabled = false;
          veTrangPdf(bytes.slice(0), khung);
        })
        .withFailureHandler(function () { khung.textContent = ''; khung.appendChild(taoThe('div', 'the loi', 'Không kết nối được. Vui lòng thử lại.')); })
        .layPhieu(maDangDung, p.maPhieu);
    }

    function veTrangPdf(bytes, khung) {
      if (!window.pdfjsLib) {
        khung.textContent = '';
        khung.appendChild(taoThe('div', 'the', 'Không hiển thị được phiếu trên trình duyệt này. Vui lòng bấm "Tải PDF".'));
        return;
      }
      pdfjsLib.getDocument({ data: bytes }).promise.then(function (pdf) {
        khung.textContent = '';
        var tiLe = Math.min(window.devicePixelRatio || 1, 2);
        var chain = Promise.resolve();
        for (var n = 1; n <= pdf.numPages; n++) {
          (function (so) {
            chain = chain.then(function () { return pdf.getPage(so); }).then(function (page) {
              var rong = Math.min(khung.clientWidth || 800, 860);
              var vp0 = page.getViewport({ scale: 1 });
              var vp = page.getViewport({ scale: (rong / vp0.width) * tiLe });
              var canvas = document.createElement('canvas');
              canvas.width = vp.width; canvas.height = vp.height;
              khung.appendChild(canvas);
              return page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
            });
          })(n);
        }
        return chain;
      }).catch(function () {
        khung.textContent = '';
        khung.appendChild(taoThe('div', 'the', 'Không hiển thị được phiếu. Vui lòng bấm "Tải PDF".'));
      });
    }
  </script>
</body>
</html>
